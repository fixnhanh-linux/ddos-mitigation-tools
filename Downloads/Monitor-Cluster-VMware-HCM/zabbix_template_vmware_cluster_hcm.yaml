      type: DEPENDENT
      key: vmc.cluster.discovery
      delay: '0'
      master_item:
        key: vmc.metrics
      lifetime: 7d
      preprocessing:
      - type: PROMETHEUS_TO_JSON
        parameters:
        - vmware_cluster_hosts
      lld_macro_paths:
      - lld_macro: '{#CLUSTER}'
        path: $.labels.cluster
      item_prototypes:
      - uuid: f579aead8fff51fb939285b1073d89e3
        name: 'Cluster {#CLUSTER}: Trang thai tren vCenter'
        type: DEPENDENT
        key: 'vmc.cluster.status[{#CLUSTER}]'
        delay: '0'
        history: 30d
        value_type: UNSIGNED
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - 'vmware_cluster_status{cluster="{#CLUSTER}"}'
          - value
          - ''
          error_handler: DISCARD_VALUE
        master_item:
          key: vmc.metrics
        tags:
        - tag: component
          value: cluster
        - tag: cluster
          value: '{#CLUSTER}'
        description: overallStatus cua cluster tren vCenter
        valuemap:
          name: VMware color status
        trigger_prototypes:
        - uuid: 2dea67f530ef5e2a8271a79fdacbeb26
          expression: 'last(/VMware Cluster HCM by vmware-cluster-exporter/vmc.cluster.status[{#CLUSTER}])=2'
          name: 'Cluster {#CLUSTER}: vCenter bao trang thai red'
          priority: AVERAGE
      - uuid: a92072db8a845d42b96b63e52852dfd9
        name: 'Cluster {#CLUSTER}: vSAN health (tong)'
        type: DEPENDENT
        key: 'vmc.cluster.vsan.health[{#CLUSTER}]'
        delay: '0'
        history: 30d
        value_type: UNSIGNED
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - 'vmware_cluster_vsan_health{cluster="{#CLUSTER}"}'
          - value
          - ''
          error_handler: DISCARD_VALUE
        master_item:
          key: vmc.metrics
        tags:
        - tag: component
          value: cluster
        - tag: cluster
          value: '{#CLUSTER}'
        description: overallHealth cua vSAN Skyline Health - chi can 1 muc do la red
        valuemap:
          name: vSAN health
        trigger_prototypes:
        - uuid: 47e1ed25609f5d66aefee1515321129a
          expression: 'last(/VMware Cluster HCM by vmware-cluster-exporter/vmc.cluster.vsan.health[{#CLUSTER}])=2'
          name: 'Cluster {#CLUSTER}: vSAN Skyline Health co muc red'
          priority: INFO
          description: Trang thai tong vSAN = red (co it nhat 1 muc Unhealthy). Muc canh bao chinh dua vao health score.
      - uuid: 7b55b3b0dbd2544484b72c8f0910c43e
        name: 'Cluster {#CLUSTER}: vSAN health score'
        type: DEPENDENT
        key: 'vmc.cluster.vsan.score[{#CLUSTER}]'
        delay: '0'
        history: 30d
        value_type: UNSIGNED
