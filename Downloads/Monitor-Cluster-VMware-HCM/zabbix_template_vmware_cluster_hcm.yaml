        - tag: component
          value: cluster
        - tag: cluster
          value: '{#CLUSTER}'
        description: 'Diem Cluster health score (0-100) tren vCenter > Monitor > vSAN > Skyline Health'
        trigger_prototypes:
        - uuid: 1bcac8ca530952ed8dca2f05d036f5f3
          expression: 'last(/VMware Cluster HCM by vmware-cluster-exporter/vmc.cluster.vsan.score[{#CLUSTER}])<{$VMC.SCORE.CRIT:"{#CLUSTER}"}'
          name: 'Cluster {#CLUSTER}: vSAN health score < {$VMC.SCORE.CRIT}'
