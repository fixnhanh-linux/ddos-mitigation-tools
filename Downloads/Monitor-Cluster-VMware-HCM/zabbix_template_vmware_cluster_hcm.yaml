zabbix_export:
  version: '6.0'
  date: '2026-10-17T00:00:00Z'
  groups:
  - uuid: d1ea2541d477542392b39f0c9944890f
    name: Templates/VMware
  templates:
  - uuid: 796759aa193858d88344eeff7f8358fe
    template: VMware Cluster HCM by vmware-cluster-exporter
    name: VMware Cluster HCM by vmware-cluster-exporter
    description: |-
      So lieu tong tung cluster VMware tu vmware-cluster-exporter (metric vmware_cluster_*).
      Moi host = 1 instance exporter; dat macro {$VMC.PORT} (9821 pool18, 9822 pool25, 9823 pool6, 9824 core) va interface IP 10.16.16.38.
      Nguong = macro, giong mau dashboard Grafana VMWARE CLUSTER HCM.
    groups:
    - name: Templates/VMware
    items:
    - uuid: 977be66544c554ab82d49f3275df920f
      name: 'Exporter: /metrics'
      type: HTTP_AGENT
      key: vmc.metrics
      delay: 1m
      history: '0'
      trends: '0'
      value_type: TEXT
      timeout: 15s
      url: 'http://{HOST.CONN}:{$VMC.PORT}/metrics'
      description: 'Item chinh: doc toan bo metric cua vmware-cluster-exporter (khong luu lich su)'
      tags:
      - tag: component
        value: raw
    - uuid: 714599446e985168af2a68c9b098346f
      name: 'Exporter: lay du lieu vCenter'
      type: DEPENDENT
      key: vmc.exporter.up
      delay: '0'
      history: 7d
      value_type: UNSIGNED
      master_item:
        key: vmc.metrics
      valuemap:
        name: Exporter up
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - vmware_cluster_exporter_up
        - value
        - ''
      tags:
      - tag: component
        value: exporter
      triggers:
      - uuid: 5292851a2f2f58d681db6454801d948e
        expression: last(/VMware Cluster HCM by vmware-cluster-exporter/vmc.exporter.up)=0
        name: 'Exporter: khong lay duoc du lieu tu vCenter'
        priority: HIGH
        description: 'Xem log: journalctl -u vmware-cluster-exporter@<instance> -n 50'
        dependencies:
        - name: 'Exporter: khong doc duoc /metrics trong {$VMC.NODATA}'
          expression: 'nodata(/VMware Cluster HCM by vmware-cluster-exporter/vmc.exporter.up,{$VMC.NODATA})=1'
      - uuid: 2a65507583905c7daa0d2179a6923f3f
        expression: 'nodata(/VMware Cluster HCM by vmware-cluster-exporter/vmc.exporter.up,{$VMC.NODATA})=1'
        name: 'Exporter: khong doc duoc /metrics trong {$VMC.NODATA}'
        priority: HIGH
        description: 'Kiem tra service vmware-cluster-exporter va firewall port {$VMC.PORT}'
    - uuid: 325ce3de586455e588f79c4e6a436c41
      name: 'Exporter: lan lay du lieu thanh cong gan nhat'
      type: DEPENDENT
      key: vmc.exporter.last_success
      delay: '0'
      history: 7d
      value_type: UNSIGNED
      units: unixtime
      master_item:
        key: vmc.metrics
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - vmware_cluster_exporter_last_success_timestamp_seconds
        - value
        - ''
      tags:
      - tag: component
        value: exporter
      triggers:
      - uuid: 95cfff6281d350a09d70e6a2c4c8c5cb
        expression: 'fuzzytime(/VMware Cluster HCM by vmware-cluster-exporter/vmc.exporter.last_success,10m)=0'
        name: 'Exporter: so lieu cu hon 10 phut'
        priority: WARNING
        dependencies:
        - name: 'Exporter: khong doc duoc /metrics trong {$VMC.NODATA}'
          expression: 'nodata(/VMware Cluster HCM by vmware-cluster-exporter/vmc.exporter.up,{$VMC.NODATA})=1'
    - uuid: 3cdae75694925bcbb638f96725a56bb3
      name: 'Exporter: thoi gian lay du lieu'
      type: DEPENDENT
      key: vmc.exporter.duration
      delay: '0'
      history: 7d
      value_type: FLOAT
      units: s
      master_item:
        key: vmc.metrics
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - vmware_cluster_exporter_collect_duration_seconds
        - value
        - ''
      tags:
      - tag: component
        value: exporter
    - uuid: 347ad14198ac5b1ab04042bede4ec93b
      name: 'Exporter: phien ban'
      type: DEPENDENT
      key: vmc.exporter.version
      delay: '0'
      history: 7d
      trends: '0'
      value_type: CHAR
      master_item:
        key: vmc.metrics
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - vmware_cluster_exporter_build_info
        - label
        - version
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: exporter
    discovery_rules:
    - uuid: af7200965b4d5e6281fbecddc07b3a9c
